name: comex
description: "COMEX - CECO Argentina · Programa de trabajo y despacho de vuelos"
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  go_router: ^18.1.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  pointycastle: ^4.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  # Exportación a Excel / PDF (lib/core/exportar), igual que salvucci_flutter
  archive: ^3.6.1
  pdf: ^3.12.0
  file_saver: ^0.7.0
  file_picker: ^13.4.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/icono/icono.png
    # Fuente de los PDF (Noto Sans, licencia OFL en assets/fuentes/OFL-NotoSans.txt).
    - assets/fuentes/NotoSans-Regular.ttf
    - assets/fuentes/NotoSans-Bold.ttf
    # Respaldo de símbolos (flechas, ✓, ●, ▲…): DejaVu Sans recortada, licencia en assets/fuentes/LICENSE-DejaVu.txt.
    - assets/fuentes/DejaVuSans-Simbolos.ttf

# Ícono de la app en todas las plataformas (el de COMEX).
# Se regenera con: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icono/icono.png"
  android: true
  adaptive_icon_background: "#123F2C"
  adaptive_icon_foreground: "assets/icono/icono_adaptativo.png"
  ios: true
  image_path_ios: "assets/icono/icono_fondo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icono/icono.png"
    background_color: "#123F2C"
    theme_color: "#123F2C"
  windows:
    generate: true
    image_path: "assets/icono/icono.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icono/icono_fondo.png"
