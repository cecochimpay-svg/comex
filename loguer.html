<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>Acceso COMEX · CECO S.A.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <script src="seguridad/seguridad.js" data-pagina="login"></script>

  <style>
    :root {
      --color-bg: #F3F5F1;
      --color-surface: #FFFFFF;
      --color-plant: #1E6B4C;
      --color-plant-dark: #123F2C;
      --color-plant-soft: rgba(30, 107, 76, 0.08);
      --color-text: #1B231D;
      --color-text-secondary: #6B7280;
      --color-border: #E5E7EB;
      --radius-card: 22px;
      --radius-input: 12px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(1200px 600px at 10% -10%, rgba(30, 107, 76, 0.10), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(30, 107, 76, 0.08), transparent 60%);
    }

    body { width: 100%; }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 40px 34px 34px;
      box-shadow: 0 1px 3px rgba(16, 26, 21, 0.06), 0 24px 48px -16px rgba(16, 26, 21, 0.18);
      text-align: center;
    }

    .marca-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--color-plant-soft);
      color: var(--color-plant-dark);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .login-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--color-plant-dark);
      margin: 0 0 6px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin: 0 0 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      border-radius: var(--radius-input);
      border: 1px solid #CBD5D0;
      background: #FFFFFF;
      color: var(--color-text);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--color-plant);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px var(--color-plant-soft);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--color-plant);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-input);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(16, 26, 21, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: background 0.15s ease, transform 0.05s ease;
      margin-top: 8px;
    }

    .btn-login:hover { background: var(--color-plant-dark); }
    .btn-login:active { transform: translateY(1px); }

    .btn-login:disabled { opacity: 0.6; cursor: wait; }

    .alert-box {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius-input);
      font-size: 12px;
      font-weight: 600;
      display: none;
      text-align: center;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
    }

    .alert-box.info {
      background: #F0F7F3;
      border-color: #A7D3BC;
      color: var(--color-plant-dark);
    }

    .login-pie {
      margin-top: 18px;
      font-size: 11px;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <img src="logo.png" alt="Logo CECO S.A." style="max-height: 52px; max-width: 170px; object-fit: contain; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto;" onerror="this.style.display='none'">
      <div class="marca-badge">CECO S.A. · COMERCIO EXTERIOR</div>
      <h2 class="login-title">Sistema de Gestión COMEX</h2>
      <p class="login-subtitle">Ingresá tu usuario y contraseña asignada.</p>

      <form id="formLogin" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label for="inputUsuario">Usuario</label>
          <input type="text" id="inputUsuario" class="form-input" placeholder="Ej: jlopez" required autofocus autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="inputClave">Contraseña</label>
          <input type="password" id="inputClave" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-login" id="btnLogin">Ingresar</button>
      </form>

      <div id="alertaMsg" class="alert-box"></div>
      <div class="login-pie">Acceso restringido a personal autorizado. Los ingresos quedan registrados.</div>
    </div>
  </div>

  <script>
    const alerta = document.getElementById('alertaMsg');

    function mostrarAlerta(texto, tipo) {
      alerta.textContent = texto;
      alerta.className = 'alert-box' + (tipo === 'info' ? ' info' : '');
      alerta.style.display = 'block';
    }

    // Aviso cuando se vuelve al ingreso desde una sesión cerrada por seguridad
    const motivo = new URLSearchParams(location.search).get('motivo');
    if (motivo === 'expirada') mostrarAlerta('Tu sesión expiró. Volvé a ingresar.', 'info');

    async function iniciarSesion(e) {
      e.preventDefault();
      const userVal = document.getElementById('inputUsuario').value.trim();
      const inputClave = document.getElementById('inputClave');
      const btn = document.getElementById('btnLogin');

      alerta.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Validando…';

      try {
        const r = await COMEX_SEG.ingresar(userVal, inputClave.value);
        if (!r.ok) {
          mostrarAlerta(r.mensaje);
          inputClave.value = '';
          inputClave.focus();
          btn.disabled = false;
          btn.innerText = 'Ingresar';
          return;
        }

        // Tanto ADM como COMEX ingresan a Vuelos
        // (ADM verá todos los vuelos en modo auditoría/exportación, y COMEX verá los suyos para operar)
        window.location.replace('vuelos/vuelos_comex.html');

      } catch (err) {
        mostrarAlerta('Error al verificar credenciales: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Ingresar';
      }
    }
  </script>
</body>
</html>
