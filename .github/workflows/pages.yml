# Publica la versión web de COMEX en GitHub Pages en cada push a main.
# Solo se suben los archivos de la app: nunca data/, servicios/, main.js, supabase/ ni .env.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar carpeta web
        run: |
          mkdir _site
          cp index.html loguer.html logo.png manifest.webmanifest sw.js _site/
          cp -r iconos estilos seguridad compartido vendor programa vuelos _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
