# Publica la versión web de COMEX en GitHub Pages en cada push a main (y en cada push a la rama flutter).
# Solo se suben los archivos de la app: nunca data/, servicios/, main.js, supabase/ ni .env.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar carpeta web
        run: |
          mkdir _site
          cp index.html loguer.html logo.png manifest.webmanifest sw.js _site/
          cp -r iconos estilos seguridad compartido vendor programa vuelos _site/
          touch _site/.nojekyll

      - id: pages
        uses: actions/configure-pages@v5

      # COMEX Flutter (rama "flutter") se publica en <sitio>/flutter/.
      # La rama flutter vuelve a disparar este workflow en cada push (publicar.yml).
      - uses: actions/checkout@v4
        with:
          ref: flutter
          path: _flutter

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Compilar COMEX Flutter
        working-directory: _flutter
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run --base-href "${{ steps.pages.outputs.base_path }}/flutter/"
          cp -r build/web ../_site/flutter

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
